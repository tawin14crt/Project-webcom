    <script>
        // อ่านค่า id จาก URL เช่น product.html?id=arabica
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        const product = products[productId] || eqproducts[productId];

        if (product) {
            document.getElementById('productimg').src = product.productimg;
            document.getElementById('productname').textContent = product.productname;
            document.getElementById('productdescription').textContent = product.productdescription;
            document.getElementById('productprice').textContent = product.productprice + " บาท";
        } else {
            document.body.innerHTML = "<p class='p-6'>ไม่พบสินค้า</p>";
        }

        
        const minusButton = document.getElementById('minusButton');
        const plusButton = document.getElementById('plusButton');
        const countItem = document.getElementById('countitem');
        const stock = document.getElementById('stock');


        stock.textContent = product.productstock;
        minusButton.onclick = function() {
            let count = parseInt(countItem.textContent);
            if (count > 1) {
                count--;
                countItem.textContent = count;
            }
        }

        plusButton.onclick = function() {

            let count = parseInt(countItem.textContent);
            if (count < product.productstock) {
                count++;
                countItem.textContent = count;
            }
        }



    </script>
